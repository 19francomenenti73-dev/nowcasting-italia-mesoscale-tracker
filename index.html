<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nowcasting Italia - Radar</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; background: #111; }
        #map { height: 100vh; width: 100vw; }
    </style>
</head>
<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([42.0, 12.5], 6);

        // Mappa standard OpenStreetMap pura al 100%, zero Carto, zero chiavi API
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        // Caricamento dati radar con forzatura anti-cache
        fetch('centroids.json?v=' + new Date().getTime())
            .then(res => res.json())
            .then(data => {
                if (data && data.length > 0 && data[0].path) {
                    let radar = data[0];
                    let radarUrl = radar.host + radar.path + '/256/{z}/{x}/{y}/2/1_1.png';
                    
                    L.tileLayer(radarUrl, {
                        tileSize: 256,
                        opacity: 0.85
                    }).addTo(map);
                }
            })
            .catch(err => console.error(err));
    </script>
</body>
</html>
