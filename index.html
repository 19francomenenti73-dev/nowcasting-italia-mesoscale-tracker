<style>
    body, html { 
        margin: 0; 
        padding: 0; 
        width: 100%; 
        height: 600px; /* Altezza fissa forzata per l'iframe di Google Sites */
        background: #0b0b0b; 
        font-family: monospace; 
        overflow: hidden; 
    }
    
    #map { 
        position: absolute;
        top: 0;
        left: 0;
        width: 100%; 
        height: 545px; /* 600px totali - 55px del banner */
    }
    
    #status-banner {
        position: absolute; 
        bottom: 0; 
        left: 0; 
        width: 100%; 
        height: 55px;
        background: rgba(15, 15, 15, 0.95); 
        border-top: 2px solid #00ffcc;
        color: #fff; 
        display: flex; 
        align-items: center; 
        justify-content: space-around;
        padding: 0 15px; 
        box-sizing: border-box; 
        z-index: 2000; 
        font-size: 12px;
    }
    
    .banner-item { display: flex; flex-direction: column; align-items: center; }
    .banner-label { color: #888; font-size: 10px; text-transform: uppercase; }
    .banner-val { color: #00ffcc; font-weight: bold; font-size: 13px; }

    @keyframes pulse-red {
        0% { transform: scale(0.95); opacity: 0.9; box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.7); }
        70% { transform: scale(1.05); opacity: 0.5; box-shadow: 0 0 0 12px rgba(255, 0, 0, 0); }
        100% { transform: scale(0.95); opacity: 0.9; box-shadow: 0 0 0 0 rgba(255, 0, 0, 0); }
    }
    @keyframes pulse-green {
        0% { transform: scale(0.95); opacity: 0.9; box-shadow: 0 0 0 0 rgba(0, 255, 100, 0.7); }
        70% { transform: scale(1.05); opacity: 0.5; box-shadow: 0 0 0 12px rgba(0, 255, 100, 0); }
        100% { transform: scale(0.95); opacity: 0.9; box-shadow: 0 0 0 0 rgba(0, 255, 100, 0); }
    }
    @keyframes pulse-black-dot {
        0% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.4); opacity: 0.4; }
        100% { transform: scale(1); opacity: 1; }
    }

    .macro-circle-red {
        border: 2px dashed #ff2222; background: rgba(255, 0, 0, 0.08);
        border-radius: 50%; animation: pulse-red 2s infinite;
    }
    .macro-circle-green {
        border: 2px dashed #00ff66; background: rgba(0, 255, 100, 0.08);
        border-radius: 50%; animation: pulse-green 3s infinite;
    }
    .nuclei-dot {
        background: #000; border: 2px solid #fff; border-radius: 50%;
        width: 10px; height: 10px; animation: pulse-black-dot 1.5s infinite;
    }
    .leaflet-popup-content { font-size: 12px; line-height: 1.4; color: #111; }
</style>
