<style>
    body, html { 
        margin: 0; 
        padding: 0; 
        width: 100%; 
        height: 600px; 
        background: #0b0b0b; 
        font-family: monospace; 
        overflow: hidden; 
    }
    
    #map { 
        width: 100%; 
        height: 545px; 
    }
    
    #status-banner {
        position: absolute; 
        bottom: 0; 
        left: 0; 
        width: 100%; 
        height: 55px;
        background: rgba(15, 15, 15, 0.95); 
        border-top: 2px solid #00ffcc;
        color: #fff; 
        display: flex; 
        align-items: center; 
        justify-content: space-around;
        padding: 0 15px; 
        box-sizing: border-box; 
        z-index: 2000; 
        font-size: 12px;
    }
    
    .banner-item { display: flex; flex-direction: column; align-items: center; }
    .banner-label { color: #888; font-size: 10px; text-transform: uppercase; }
    .banner-val { color: #00ffcc; font-weight: bold; font-size: 13px; }

    /* Animazione pulita basata solo sull'opacità nativa SVG, zero rimbalzi */
    @keyframes svg-pulse-red {
        0% { stroke-opacity: 0.4; fill-opacity: 0.05; }
        50% { stroke-opacity: 1; fill-opacity: 0.2; }
        100% { stroke-opacity: 0.4; fill-opacity: 0.05; }
    }
    @keyframes svg-pulse-green {
        0% { stroke-opacity: 0.4; fill-opacity: 0.05; }
        50% { stroke-opacity: 1; fill-opacity: 0.2; }
        100% { stroke-opacity: 0.4; fill-opacity: 0.05; }
    }
    @keyframes pulse-black-dot {
        0% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.4); opacity: 0.4; }
        100% { transform: scale(1); opacity: 1; }
    }

    .macro-circle-red {
        stroke: #ff2222;
        stroke-width: 2px;
        stroke-dasharray: 6, 6;
        animation: svg-pulse-red 2s infinite ease-in-out;
    }
    .macro-circle-green {
        stroke: #00ff66;
        stroke-width: 2px;
        stroke-dasharray: 6, 6;
        animation: svg-pulse-green 3s infinite ease-in-out;
    }
    .nuclei-dot {
        background: #000; border: 2px solid #fff; border-radius: 50%;
        width: 10px; height: 10px; animation: pulse-black-dot 1.5s infinite;
    }
    .leaflet-popup-content { font-size: 12px; line-height: 1.4; color: #111; }
</style>
