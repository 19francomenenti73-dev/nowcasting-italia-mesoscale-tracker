    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([42.0, 12.5], 6);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        var operationalLayer = L.layerGroup().addTo(map);

        function loadWeatherData() {
            // Sostituisci con il tuo URL assoluto di GitHub Pages se usi un iframe esterno
            let jsonUrl = 'centroids.json?v=' + new Date().getTime();
            
            fetch(jsonUrl)
                .then(res => {
                    if (!res.ok) throw new Error('HTTP error! status: ' + res.status);
                    return res.json();
                })
                .then(data => {
                    operationalLayer.clearLayers();

                    if (data.radar_tile && data.radar_tile.path) {
                        let radarUrl = data.radar_tile.host + data.radar_tile.path + '/256/{z}/{x}/{y}/2/1_1.png';
                        L.tileLayer(radarUrl, { tileSize: 256, opacity: 0.75 }).addTo(map);
                    }

                    let structures = data.macro_structures || [];
                    if (structures.length > 0) {
                        let primary = structures[0];
                        document.getElementById('b-struct').innerText = primary.type;
                        document.getElementById('b-speed').innerText = primary.speed_kmh + ' km/h';
                        document.getElementById('b-height').innerText = primary.height_km + ' km';
                        document.getElementById('b-vis').innerText = primary.vis;

                        structures.forEach(item => {
                            let center = [item.center[0], item.center[1]];
                            let radiusMeters = item.radius_km * 1000;
                            let isClosest = (item.distance_rank === 'closest');
                            let circleClass = isClosest ? 'macro-circle-red' : 'macro-circle-green';
                            let lineColor = isClosest ? '#ff2222' : '#00ff66';

                            let macroCircle = L.circle(center, {
                                radius: radiusMeters,
                                className: circleClass,
                                weight: 2,
                                fillOpacity: 0.1
                            }).bindPopup(`<b>Struttura:</b> ${item.type}<br><b>ID:</b> ${item.id}<br><b>Velocità:</b> ${item.speed_kmh} km/h<br><b>Quota:</b> ${item.height_km} km`);
                            operationalLayer.addLayer(macroCircle);

                            if (item.actual_path && item.actual_path.length > 0) {
                                let actualLine = L.polyline(item.actual_path, {
                                    color: '#0055ff',
                                    weight: 4
                                });
                                operationalLayer.addLayer(actualLine);
                            }

                            if (item.forecast_path && item.forecast_path.length > 0) {
                                let forecastLine = L.polyline(item.forecast_path, {
                                    color: lineColor,
                                    weight: 3,
                                    dashArray: '8, 8',
                                    className: 'pulsing-forecast'
                                }).bindTooltip(`<b>${item.eta_cep}</b>`, {permanent: true, direction: 'top'});
                                operationalLayer.addLayer(forecastLine);
                            }

                            if (item.nuclei && item.nuclei.length > 0) {
                                item.nuclei.forEach(nuc => {
                                    let dotIcon = L.divIcon({
                                        className: 'nuclei-dot',
                                        iconSize: [12, 12]
                                    });
                                    let nucMarker = L.marker([nuc.lat, nuc.lon], { icon: dotIcon })
                                        .bindPopup(`<b>Nucleo Interno</b><br>Intensità: ${nuc.intensity || 'N/D'}`);
                                    operationalLayer.addLayer(nucMarker);
                                });
                            }
                        });
                    }
                })
                .catch(err => {
                    console.error('Errore caricamento telemetria:', err);
                    document.getElementById('b-struct').innerText = 'ERRORE DATI';
                });
        }

        loadWeatherData();
        setInterval(loadWeatherData, 60000);
    </script>
