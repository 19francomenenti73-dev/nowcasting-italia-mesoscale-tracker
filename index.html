<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nowcasting Italia - Radar Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; background: #111; }
        #map { height: 100vh; width: 100vw; }
    </style>
</head>
<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Inizializza la mappa centrata sull'Italia
        var map = L.map('map').setView([42.0, 12.5], 6);

        // Mappa base scura in stile sala operativa
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
        }).addTo(map);

        // Carica i dati radar generati dal bot
        fetch('centroids.json')
            .then(response => response.json())
            .then(data => {
                if (data && data.length > 0) {
                    let radarData = data[0];
                    let radarUrl = radarData.host + radarData.path + '/256/{z}/{x}/{y}/2/1_1.png';
                    
                    // Aggiunge il layer radar trasparente sopra la mappa
                    L.tileLayer(radarUrl, {
                        tileSize: 256,
                        opacity: 0.8,
                        attribution: 'RainViewer API'
                    }).addTo(map);
                }
            })
            .catch(err => console.error('Errore nel caricamento del layer radar:', err));
    </script>
</body>
</html>
