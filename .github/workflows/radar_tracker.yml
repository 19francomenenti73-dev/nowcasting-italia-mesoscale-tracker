name: tracker di corsa

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  update-radar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy scipy pillow

      - name: Run Tracker Script
        run: python tracker.py

      - name: Commit and push updated centroids.json
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add centroids.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update radar centroids [skip ci]" && git push)
          
