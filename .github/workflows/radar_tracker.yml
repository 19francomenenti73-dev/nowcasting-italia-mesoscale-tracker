name: Mesoscale Radar Tracker Engine

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy pillow scipy

      - name: Run Radar Tracker Engine
        run: python tracker.py

      - name: Commit and push updated JSON
        run: |
          git config --global user.name "Radar Tracker Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add centroids.json history.json
          git diff --staged --quiet || (git commit -m "Auto-update radar centroids and vectors [skip ci]" && git push)
