name: Aggiornamento Radar Tracker

on:
  workflow_dispatch:
  # Se vuoi che si avvii automaticamente ogni 3 minuti, decommenta le righe sotto:
  # schedule:
  #   - cron: '*/3 * * * *'

jobs:
  update-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy opencv-python-headless pillow

      - name: Esegui script Python
        run: python tracker.py

      - name: Salva e carica le modifiche su GitHub
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add centroids.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-aggiornamento centroidi radar [skip ci]" && git push)
          
