name: radar_tracker

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'  # Esegue il tracker ogni 15 minuti

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy scipy opencv-python

      - name: Run tracker script
        run: python tracker.py

      - name: Commit and push updated centroids
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "action@github.com"
          git add centroids.json
          git commit -m "Aggiornamento automatico centroidi e vettori radar [skip ci]" || echo "Nessuna modifica da salvare"
          git push
          
